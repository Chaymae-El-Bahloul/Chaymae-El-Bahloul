<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Chaymae El Bahloul, étudiante en Science des Données">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset=".6" stop-color="#150d24"/><stop offset="1" stop-color="#1c0f12"/></linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#FFD3A8"/><stop offset="1" stop-color="#FFB84D"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6B35"/><stop offset=".5" stop-color="#14B8A6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
<style>
.m{font-family:ui-monospace,Menlo,Consolas,monospace}.s{font-family:Georgia,'Times New Roman',serif}
.o1{animation:d1 9s ease-in-out infinite}.o2{animation:d2 11s ease-in-out infinite}.o3{animation:d1 13s ease-in-out infinite reverse}
@keyframes d1{50%{transform:translate(60px,30px)}}@keyframes d2{50%{transform:translate(-50px,-34px)}}
.w1{animation:wv 7s linear infinite}.w2{animation:wv 11s linear infinite reverse}@keyframes wv{to{transform:translateX(-400px)}}
.c{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-12px)}}
.r{opacity:0;animation:rl 12s infinite}.r1{animation-delay:0s}.r2{animation-delay:3s}.r3{animation-delay:6s}.r4{animation-delay:9s}
@keyframes rl{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}27%,100%{opacity:0;transform:translateY(-6px)}}
.cur{animation:bk 1s steps(2) infinite}@keyframes bk{50%{opacity:0}}
.up{animation:up 1s ease-out both}@keyframes up{from{opacity:0;transform:translateY(16px)}}
</style></defs>
<rect width="1000" height="320" fill="url(#bg)"/>
<g filter="url(#bl)"><circle class="o1" cx="190" cy="80" r="130" fill="#FF6B35" opacity=".55"/><circle class="o2" cx="780" cy="230" r="150" fill="#14B8A6" opacity=".42"/><circle class="o3" cx="520" cy="40" r="110" fill="#8B5CF6" opacity=".45"/></g>
