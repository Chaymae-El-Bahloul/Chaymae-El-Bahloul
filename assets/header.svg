<g class="c" style="animation-delay:2.6s"><rect x="860" y="262" width="80" height="28" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/><text class="m" x="873" y="281" font-size="13" fill="#ffe3cf">Gemini</text></g>
<g class="c" style="animation-delay:3.4s"><rect x="885" y="196" width="98" height="28" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/><text class="m" x="898" y="215" font-size="13" fill="#ffe3cf">Power BI</text></g>
<g class="c" style="animation-delay:4.2s"><rect x="640" y="130" width="80" height="28" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/><text class="m" x="653" y="149" font-size="13" fill="#ffe3cf">Pandas</text></g>
<g class="c" style="animation-delay:0.9s"><rect x="780" y="150" width="53" height="28" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/><text class="m" x="793" y="169" font-size="13" fill="#ffe3cf">Git</text></g>
<g class="up"><text class="m" x="60" y="92" fill="#FFB84D" font-size="15" letter-spacing="4">DATA · DÉVELOPPEMENT · IA</text>
<text class="s" x="58" y="168" fill="url(#nm)" font-size="68" font-weight="700">Chaymae</text>
<text class="s" x="58" y="232" fill="#2DD4BF" font-size="58" font-style="italic">El Bahloul</text></g>
