<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="Live data pipeline that rebuilds this profile every day: extract from the GitHub API, transform with Python, load into this README">
<rect width="1000" height="450" rx="18" fill="#0B1020" stroke="#1F2A44"/>
<circle cx="30" cy="30" r="6" fill="#FF5F57"/><circle cx="50" cy="30" r="6" fill="#FEBC2E"/><circle cx="70" cy="30" r="6" fill="#28C840"/>
<text x="95" y="35" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start" >pipeline.py  --  this profile is the output of a data pipeline</text>
<text x="960" y="35" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="end" >runs daily 00:00 UTC</text>
<rect x="40" y="70" width="250" height="110" rx="12" fill="#111A33" stroke="#FF6B35" stroke-width="1.5"/><rect x="40" y="70" width="6" height="110" rx="3" fill="#FF6B35"/><text x="62" y="98" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="15" fill="#FF6B35" font-weight="700" text-anchor="start" >01  EXTRACT</text><text x="62" y="121" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#E2E8F0" font-weight="400" text-anchor="start" >GitHub REST API</text><text x="62" y="147" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start" >-- repositories</text><text x="62" y="166" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start" >-- API calls</text>
<rect x="375" y="70" width="250" height="110" rx="12" fill="#111A33" stroke="#14B8A6" stroke-width="1.5"/><rect x="375" y="70" width="6" height="110" rx="3" fill="#14B8A6"/><text x="397" y="98" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="15" fill="#14B8A6" font-weight="700" text-anchor="start" >02  TRANSFORM</text><text x="397" y="121" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#E2E8F0" font-weight="400" text-anchor="start" >Python, standard library only</text><text x="397" y="147" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start" >-- languages ranked</text><text x="397" y="166" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start" >-- commits, 30 days</text>
<rect x="710" y="70" width="250" height="110" rx="12" fill="#111A33" stroke="#8B5CF6" stroke-width="1.5"/><rect x="710" y="70" width="6" height="110" rx="3" fill="#8B5CF6"/><text x="732" y="98" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="15" fill="#8B5CF6" font-weight="700" text-anchor="start" >03  LOAD</text><text x="732" y="121" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#E2E8F0" font-weight="400" text-anchor="start" >README + SVG + CSV</text><text x="732" y="147" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start" >assets/pipeline.svg</text><text x="732" y="166" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start" >data/history.csv</text>
