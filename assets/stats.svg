<circle cx="621.0" cy="74" r="40" fill="#2DD4BF" opacity=".22" filter="url(#bl)"/>
<circle cx="621.0" cy="74" r="42" fill="none" stroke="#2DD4BF" stroke-opacity=".16" stroke-width="8"/>
<circle class="rg" cx="621.0" cy="74" r="42" pathLength="100" fill="none" stroke="url(#r2)" stroke-width="8" stroke-linecap="round" style="--o:35;animation-delay:0.5s"/>
