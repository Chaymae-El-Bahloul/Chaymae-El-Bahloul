<circle cx="379.0" cy="74" r="40" fill="#FFB347" opacity=".22" filter="url(#bl)"/>
<circle cx="379.0" cy="74" r="42" fill="none" stroke="#FFB347" stroke-opacity=".16" stroke-width="8"/>
