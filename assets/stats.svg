<circle cx="863.0" cy="74" r="40" fill="#A78BFA" opacity=".22" filter="url(#bl)"/>
<circle cx="863.0" cy="74" r="42" fill="none" stroke="#A78BFA" stroke-opacity=".16" stroke-width="8"/>
<circle class="rg" cx="863.0" cy="74" r="42" pathLength="100" fill="none" stroke="url(#r3)" stroke-width="8" stroke-linecap="round" style="--o:50;animation-delay:0.75s"/>
<g class="pop" style="animation-delay:1.25s"><text class="s" x="863.0" y="87" text-anchor="middle" font-size="38" font-weight="700" fill="#F5F7FF">3</text></g>
<text class="m" x="863.0" y="158" text-anchor="middle" font-size="14" fill="#C9CCE6">Certifications</text>
