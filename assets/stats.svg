<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Key figures: 7 projects, 2 internships, 3 languages, 3 certifications" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Key figures</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B1A"/><stop offset=".55" stop-color="#110F2E"/><stop offset="1" stop-color="#201040"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#fff" fill-opacity=".07"/></pattern>
<filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
<linearGradient id="r0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A59"/><stop offset="1" stop-color="#FFB08F"/></linearGradient><linearGradient id="r1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB347"/><stop offset="1" stop-color="#FFD58A"/></linearGradient><linearGradient id="r2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#7CF0DF"/></linearGradient><linearGradient id="r3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#CDB9FF"/></linearGradient>
<style>
.s{font-family:Georgia,'Times New Roman',serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.rg{stroke-dasharray:100;stroke-dashoffset:100;animation:dr 2s cubic-bezier(.2,.7,.2,1) forwards;transform:rotate(-90deg);transform-origin:center;transform-box:fill-box}
@keyframes dr{to{stroke-dashoffset:var(--o)}}
.pop{opacity:0;animation:po .8s ease-out forwards}@keyframes po{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rg{animation:none;stroke-dashoffset:var(--o)}.pop{animation:none;opacity:1}}
</style></defs>
<rect x=".75" y=".75" width="998.5" height="188.5" rx="18" fill="url(#bg)" stroke="#fff" stroke-opacity=".08" stroke-width="1.5"/>
<rect x=".75" y=".75" width="998.5" height="188.5" rx="18" fill="url(#dots)"/>
<rect x="24" y="14" width="226" height="162" rx="18" fill="#0D1230" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.5"/>
