<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Chiffres clés : 7 projets, 2 stages, 3 langues, 2 certifications">
<defs><style>.s{font-family:Georgia,serif}.m{font-family:ui-monospace,Menlo,monospace}.rg{stroke-dasharray:314;stroke-dashoffset:314;animation:dr 2s ease-out forwards;transform:rotate(-90deg);transform-origin:center;transform-box:fill-box}@keyframes dr{to{stroke-dashoffset:var(--o)}}.pop{opacity:0;animation:po .8s ease-out forwards}@keyframes po{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style></defs>
<rect width="1000" height="190" rx="18" fill="#0B1020"/>
<circle cx="125" cy="82" r="50" fill="none" stroke="#FF6B35" stroke-opacity=".18" stroke-width="9"/><circle class="rg" cx="125" cy="82" r="50" fill="none" stroke="#FF6B35" stroke-width="9" stroke-linecap="round" style="--o:31.39999999999999;animation-delay:0.0s"/>
<g class="pop" style="animation-delay:0.5s"><text class="s" x="125" y="95" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">7</text></g><text class="m" x="125" y="166" text-anchor="middle" font-size="15" fill="#d8cfc7">Projets réalisés</text>
<circle cx="375" cy="82" r="50" fill="none" stroke="#14B8A6" stroke-opacity=".18" stroke-width="9"/><circle class="rg" cx="375" cy="82" r="50" fill="none" stroke="#14B8A6" stroke-width="9" stroke-linecap="round" style="--o:157.0;animation-delay:0.25s"/>
<g class="pop" style="animation-delay:0.75s"><text class="s" x="375" y="95" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">2</text></g><text class="m" x="375" y="166" text-anchor="middle" font-size="15" fill="#d8cfc7">Stages</text>
<circle cx="625" cy="82" r="50" fill="none" stroke="#8B5CF6" stroke-opacity=".18" stroke-width="9"/><circle class="rg" cx="625" cy="82" r="50" fill="none" stroke="#8B5CF6" stroke-width="9" stroke-linecap="round" style="--o:109.89999999999999;animation-delay:0.5s"/>
<g class="pop" style="animation-delay:1.0s"><text class="s" x="625" y="95" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">3</text></g><text class="m" x="625" y="166" text-anchor="middle" font-size="15" fill="#d8cfc7">Langues parlées</text>
<circle cx="875" cy="82" r="50" fill="none" stroke="#FFB84D" stroke-opacity=".18" stroke-width="9"/><circle class="rg" cx="875" cy="82" r="50" fill="none" stroke="#FFB84D" stroke-width="9" stroke-linecap="round" style="--o:157.0;animation-delay:0.75s"/>
<g class="pop" style="animation-delay:1.25s"><text class="s" x="875" y="95" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">2</text></g><text class="m" x="875" y="166" text-anchor="middle" font-size="15" fill="#d8cfc7">Certifications</text>
</svg>