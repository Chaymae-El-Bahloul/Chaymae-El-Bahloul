<g class="pop" style="animation-delay:0.5s"><text class="s" x="137.0" y="87" text-anchor="middle" font-size="38" font-weight="700" fill="#F5F7FF">7</text></g>
<text class="m" x="137.0" y="158" text-anchor="middle" font-size="14" fill="#C9CCE6">Projects completed</text>
