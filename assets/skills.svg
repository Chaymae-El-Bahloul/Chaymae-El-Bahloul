<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Technologies classées par nombre de projets : Python 6, bases de données 3, Streamlit 2, Flask 2, Plotly 2, IA 2, Docker 1, C 1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="8" y="8" width="984" height="424" rx="16" fill="#0B1020" stroke="#2A2F55" stroke-width="2"/>
