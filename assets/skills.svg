<text x="40" y="76" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#9AA4C7">1 barre = les projets réels où je l'ai utilisée (sur 7 projets)</text>
<text x="40" y="125" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#CBD5E1">Python</text>
